name: Deploy App
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [apply, destroy]
        default: apply
        description: Operação da aplicação
permissions:
  contents: read
  id-token: write
concurrency:
  group: lab03-app
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: 'true'
  APP_VERSION: 1.0.0
  IMAGE_NAME: containers-technologies
jobs:
  build:
    name: Building app
    if: inputs.operation != 'destroy'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Set version and commit tag
        id: tag
        run: echo "image_tag=v${APP_VERSION}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest -v test
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Docker image
        run: docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:${{ steps.tag.outputs.image_tag }}" .
      - name: Trivy | Vulnerability scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/containers-technologies:${{ steps.tag.outputs.image_tag }}'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: CRITICAL
      - name: Push Docker image
        run: docker push "${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:${{ steps.tag.outputs.image_tag }}"
  deploy:
    name: Deploy App
    needs: build
    if: always() && (needs.build.result == 'success' || inputs.operation == 'destroy')
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_state_bucket: ${{ vars.AWS_STATE_BUCKET }}
    defaults:
      run:
        shell: bash
        working-directory: app/deploy
    steps:
      - uses: actions/checkout@v4
      - name: AWS | Configure credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Render exact image in task definition
        if: inputs.operation != 'destroy'
        id: task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: app/deploy/ecs-task-definition.json
          container-name: ci-cd-app
          image: '${{ secrets.DOCKERHUB_USERNAME }}/containers-technologies:${{ needs.build.outputs.image_tag }}'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Terraform | Initialize backend
        run: terraform init -backend-config="bucket=$TF_VAR_state_bucket" -backend-config="key=app-prod.tfstate" -backend-config="region=$AWS_REGION"
      - name: Terraform | Format and validate
        run: |
          terraform fmt -check -recursive
          terraform validate
      - name: Terraform | Plan
        env:
          RENDERED_TASK_PATH: ${{ steps.task.outputs.task-definition }}
        run: |
          if [ '${{ inputs.operation }}' = 'destroy' ]; then
            terraform plan -destroy -out=tfplan
          else
            terraform plan -var="rendered_task_path=$RENDERED_TASK_PATH" -out=tfplan
          fi
      - name: Terraform | Deploy or destroy application
        run: terraform apply -input=false tfplan
      - name: Validate service and endpoint
        if: inputs.operation != 'destroy'
        run: |
          aws ecs wait services-stable --cluster app-prod-cluster --services app-service
          aws ecs describe-services --cluster app-prod-cluster --services app-service --query 'services[0].{desired:desiredCount,running:runningCount,taskDefinition:taskDefinition,deployments:deployments}'
          URL=$(terraform output -raw nlb_dns_name)
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors "$URL"
          terraform output
