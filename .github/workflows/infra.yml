name: Deploy Infra
on:
  push:
    branches: [infra]
    paths: ['infra/**', '.github/workflows/infra.yml']
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [apply, destroy]
        default: apply
        description: 'Destroy somente depois de remover a aplicação'
permissions:
  contents: write
  id-token: write
concurrency:
  group: lab03-infra
  cancel-in-progress: false
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_IN_AUTOMATION: 'true'
jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - name: AWS | Configure credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Terraform | Initialize backend
        run: terraform init -backend-config="bucket=${{ vars.AWS_STATE_BUCKET }}" -backend-config="key=infra-prod.tfstate" -backend-config="region=$AWS_REGION"
      - name: Terraform | Format and validate
        run: |
          terraform fmt -check -recursive
          terraform validate
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.52.0
      - name: TFLint | Validate infrastructure
        run: |
          tflint --init
          tflint -f compact
      - name: TFSec | Security checks
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: infra
          soft_fail: true
      - name: Terraform-docs | Generate documentation
        uses: terraform-docs/gh-actions@v1.3.0
        with:
          working-dir: infra
          output-file: README.md
          output-method: inject
          git-push: 'true'
      - name: Terraform | Plan
        run: |
          if [ '${{ inputs.operation }}' = 'destroy' ]; then
            terraform plan -destroy -out=tfplan
          else
            terraform plan -out=tfplan
          fi
      - name: Terraform | Apply saved plan
        run: terraform apply -input=false tfplan
      - name: Terraform | Outputs
        if: inputs.operation != 'destroy'
        run: terraform output
